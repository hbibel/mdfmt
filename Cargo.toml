[package]
name = "mdfmt"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Source-preserving Markdown formatting foundation"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
markdown = "=1.0.0"
regex = "1"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = { version = "0.9", features = ["preserve_order"] }
jsonc-parser = { version = "0.26", features = ["serde"] }
globset = "0.4"
walkdir = "2"
ignore = "0.4"
