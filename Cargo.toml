[package]
name = "mdfmt"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Source-preserving Markdown formatting foundation"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
markdown = "=1.0.0"
regex = "1"
regex-syntax = "0.8"
tempfile = "3"
command-group = { version = "=5.0.1", default-features = false }
oxc_resolver = { version = "=11.24.3", path = "vendor/oxc_resolver", default-features = false }
clap = { version = "4", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = { version = "0.9", features = ["preserve_order"] }
jsonc-parser = { version = "0.26", features = ["serde"] }
walkdir = "2"
ignore = "0.4"
icu_properties = "=2.1.2"
icu_collator = "=2.1.1"
unicode-segmentation = "=1.13.3"
url = "2.5"
regress = { path = "vendor/regress", default-features = false, features = ["std", "prohibit-unsafe", "utf16"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }
