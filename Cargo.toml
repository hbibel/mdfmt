[package]
name = "mdfmt"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Source-preserving Markdown formatting foundation"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
markdown = "=1.0.0"
regex = "1"
tempfile = "3"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
